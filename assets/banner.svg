<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="banner-title banner-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="banner-title">Hafizh Ahmad Al Mushoffi (bladecs)</title>
  <desc id="banner-desc">Full stack web, mobile, and QA. Open to freelance work.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="720" height="220" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .name { font: 700 40px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f2efe8; }
    .role { font: 400 23px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #aab3bc; }
    .mono { font: 500 19px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .handle { fill: #f59e0b; }
    .status { fill: #d6dbe0; }
    .edge { stroke: #f59e0b; stroke-width: 3; stroke-dasharray: 240; stroke-dashoffset: 0; animation: draw 1s ease-out 0.2s both; }
    @keyframes draw { from { stroke-dashoffset: 240; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .edge { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="720" height="220" fill="#14181c"/>
    <polygon points="640,0 720,0 720,220 560,220" fill="#1c2329"/>
    <line class="edge" x1="640" y1="0" x2="560" y2="220"/>
  </g>
  <rect x="0.5" y="0.5" width="719" height="219" rx="12" fill="none" stroke="#2a323a"/>
  <text class="mono handle" x="48" y="66">@bladecs</text>
  <text class="name" x="48" y="118">Hafizh Ahmad Al Mushoffi</text>
  <text class="role" x="48" y="158">Full stack web, mobile, and QA</text>
  <circle cx="54" cy="193" r="5" fill="#f59e0b"/>
  <text class="mono status" x="70" y="199">open to freelance</text>
</svg>
